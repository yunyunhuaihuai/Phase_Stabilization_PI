name: Offline PI validation
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure offline build
        run: cmake -S . -B build -DUSE_REAL_HARDWARE=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: C++ and CLI simulation tests
        run: ctest --test-dir build --output-on-failure
      - name: Python mock and analysis tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
